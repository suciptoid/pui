name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: Library (${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.7"
            otp: "26.2.5"
          - elixir: "1.20.0"
            otp: "29.0"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
          install-hex: true
          install-rebar: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
      - run: mix docs
      - run: mix build
      - run: mix hex.build

  demo:
    name: Demo browser suite
    runs-on: ubuntu-latest
    needs: library

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0"
          otp-version: "29.0"
          version-type: strict
          install-hex: true
          install-rebar: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install browser dependencies
        run: sudo apt-get update && sudo apt-get install -y chromium chromium-driver

      - name: Install dependencies
        working-directory: demo
        run: mix deps.get

      - name: Run demo tests
        working-directory: demo
        env:
          APP_TEST_PORT: "4402"
          CHROMEDRIVER_PATH: /usr/bin/chromedriver
          GOOGLE_CHROME_BINARY: /usr/bin/chromium
        run: mix test
